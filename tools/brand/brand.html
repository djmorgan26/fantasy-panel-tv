<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>Brand</title>
    <style>
      @font-face { font-family: 'Inter'; src: url('fonts/inter-var.woff2') format('woff2'); font-weight: 100 900; }
      html, body { margin: 0; background: transparent; }
      .banner { width: 320px; height: 180px; display: flex; align-items: center; gap: 18px; padding: 0 28px; box-sizing: border-box;
        background: radial-gradient(120% 140% at 0% 0%, #26262c 0%, #0e0e10 60%); font-family: 'Inter', sans-serif; color: #f5f5f7; }
      .banner .t { font-size: 25px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.05; }
      .banner .s { display: flex; align-items: center; gap: 6px; margin-top: 9px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(235,235,245,.6); }
      .banner .s i { width: 7px; height: 7px; border-radius: 50%; background: #30d158; }
      .icon { width: 192px; height: 192px; border-radius: 44px; display: grid; place-items: center;
        background: radial-gradient(120% 120% at 0% 0%, #2a2a30 0%, #0e0e10 70%); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const ball = (size) => `
        <svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true">
          <g transform="rotate(-38 32 32)">
            <ellipse cx="32" cy="32" rx="27" ry="16.5" fill="#f5f5f7"/>
            <path d="M14 22.5c2.5 3.2 2.5 15.8 0 19M50 22.5c-2.5 3.2-2.5 15.8 0 19" stroke="#0e0e10" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            <path d="M23 32h18" stroke="#0e0e10" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M27 28.5v7M32 28.5v7M37 28.5v7" stroke="#0e0e10" stroke-width="2.4" stroke-linecap="round"/>
          </g>
          <circle cx="53" cy="12" r="6.5" fill="#30d158"/>
        </svg>`;
      const kind = new URLSearchParams(location.search).get('kind') || 'banner';
      document.getElementById('root').innerHTML =
        kind === 'icon'
          ? `<div class="icon" id="art">${ball(128)}</div>`
          : `<div class="banner" id="art">${ball(72)}<div><div class="t">Fantasy<br>Football</div><div class="s"><i></i>Live panel</div></div></div>`;
    </script>
  </body>
</html>
